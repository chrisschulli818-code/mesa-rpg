# Render Blueprint: New → Blueprint → escolha este repositório.
# As mesas ficam salvas no MongoDB Atlas (o disco do Render grátis é apagado a cada reinício).
services:
  - type: web
    name: mesa-rpg
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Cole o valor no painel do Render (nunca no repositório): mongodb+srv://usuario:senha@cluster.../
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: mesa
